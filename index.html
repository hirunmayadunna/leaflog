<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- <span aria-hidden="true">📚</span> -->
    <title>LeafLog - Reading Log</title>
    <meta name="description" content="Track books you want to read, are reading, and have finished.">
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- Skip to main content for keyboard/screen readers -->
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header" role="banner">
        <div class="container header_inner">
            <h1 class="site-title" aria-label="Leaflog Reading Log">
                <span aria-hidden="true"><img class="mlogo" src="assets/Mlogo2.png" alt="LeafLog logo"></span>
                LeafLog
            </h1>
            <nav aria-label="header">
                <ul class="nav">
                    <li class="brand">
                        <a href="https://github.com/hirunmayadunna" aria-label="LeafLog Home">
                            <img src="assets/logo.png" alt="LeafLog logo">
                        </a>
                    </li>

                    <!-- <li><a href="#/stats">Stats</a></li>
                    <li><a class="muted" href="https://github.com/hirunmayadunna/leaflog" target="_blank"
                            rel="noopener">GitHub</a></li> -->
                </ul>
            </nav>
        </div>
    </header>

    <!-- Live region for brief messages (SR-friendly) -->
    <p id="toast" class="sr-only" role="status" aria-live="polite"></p>

    <main id="main" class="site-main" tabindex="-1">
        <!-- Controls bar -->
        <section class="controls container" aria-labelledby="controls-heading">
            <h2 id="controls-heading" class="sr-only">Controls</h2>

            <div class="controls_row">
                <label class="field">
                    <span class="field_label">Search Title/Author</span>
                    <input id="search" type="search" placeholder="e.g., Atomic Habits" />
                </label>

                <label class="field">
                    <span class="field_label">Status</span>
                    <select id="statusFilter" aria-label="Filter by status">
                        <option value="all">All</option>
                        <option value="to-read">To-read</option>
                        <option value="reading">Reading</option>
                        <option value="done">Done</option>
                    </select>
                </label>

                <label class="field">
                    <span class="field_label">Sort</span>
                    <select id="sortSelect" aria-label="Sort books">
                        <option value="recent">Recently Added</option>
                        <option value="title">Title (A→Z)</option>
                        <option value="author">Author (A→Z)</option>
                        <option value="status">Status (To-read → Reading → Done)</option>
                    </select>
                </label>


                <button id="addBookBtn" class="btn primary" type="button" aria-haspopup="dialog"
                    aria-controls="addDialog">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-book">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0" />
                        <path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0" />
                        <path d="M3 6l0 13" />
                        <path d="M12 6l0 13" />
                        <path d="M21 6l0 13" />
                    </svg>
                    <b>+ Add Book</b></button>
            </div>
        </section>

        <!-- Results / Empty state -->
        <section class="container" aria-labelledby="list-heading">
            <h2 id="list-heading" class="sr-only">Book List</h2>
            <div id="bookGrid" class="grid">
                <!-- Cards will be injected here -->
            </div>
            <p id="emptyState" class="empty muted" role="status" aria-live="polite">
                No books yet- use "Add Book" to create your entry.
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <small>© Hirun Mayadunna · All rights reserved.</small>
        </div>
    </footer>

    <!-- Minimal Keyboard help Target -->
    <section id="keyboard-help" class="sr-only" aria-label="Keyboard-help">
        Tab/Shift+Tab move, Enter to activate, Esc to close dialogs.
    </section>



    <!-- Add Book Modal (in-page dialog) -->
    <div id="addDialog" class="modal" role="dialog" aria-modal="true" aria-labelledby="addDialogTitle" hidden>
        <div class="modal__backdrop" data-close></div>
        <div class="modal__panel" role="document">
            <header class="modal__header">
                <h2 id="addDialogTitle">Add a Book</h2>
                <button class="modal__close btn" type="button" aria-label="Close add book" data-close>✕</button>
            </header>

            <form id="addForm" class="form" novalidate>
                <label class="field" id="titleField">
                    <span class="field__label field_label">Title <span aria-hidden="true">*</span></span>
                    <input id="titleInput" name="title" required placeholder="e.g., Atomic Habits"
                        aria-describedby="titleHelp titleError" />
                    <small id="titleHelp" class="help">Max 120 characters.</small>
                    <small id="titleError" class="error" hidden></small>
                </label>

                <label class="field" id="authorField">
                    <span class="field__label field_label">Author <span aria-hidden="true">*</span></span>
                    <input id="authorInput" name="author" required placeholder="e.g., James Clear"
                        aria-describedby="authorHelp authorError" />
                    <small id="authorHelp" class="help">Max 120 characters.</small>
                    <small id="authorError" class="error" hidden></small>
                </label>

                <label class="field">
                    <span class="field__label field_label">Status</span>
                    <select id="statusInput" name="status">
                        <option value="to-read">To-read</option>
                        <option value="reading">Reading</option>
                        <option value="done">Done</option>
                    </select>
                </label>

                <p id="addError" class="form__error" role="alert" aria-live="polite" hidden></p>

                <div class="modal__actions">
                    <button type="button" class="btn" data-close>Cancel</button>
                    <button type="submit" class="btn primary">Save Book</button>
                </div>
            </form>


        </div>
    </div>
    <script src="app.js" defer></script>
</body>

</html>
